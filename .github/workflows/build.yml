name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & generate spec (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Checkout parent POM
        uses: actions/checkout@v6
        with:
          repository: rspereiratech/openapi-generator-parent
          path: openapi-generator-parent
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install parent POM
        run: mvn -B -ntp --settings ci-settings.xml -f openapi-generator-parent/pom.xml -DskipTests install

      - name: Checkout core
        uses: actions/checkout@v6
        with:
          repository: rspereiratech/openapi-generator-core
          path: openapi-generator-core
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install core
        run: mvn -B -ntp --settings ci-settings.xml -f openapi-generator-core/pom.xml -DskipTests install

      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          repository: rspereiratech/openapi-generator-maven-plugin
          path: openapi-generator-maven-plugin
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install plugin
        run: mvn -B -ntp --settings ci-settings.xml -f openapi-generator-maven-plugin/pom.xml -DskipTests install

      - name: Build and generate spec
        run: mvn -B -ntp --settings ci-settings.xml process-classes
